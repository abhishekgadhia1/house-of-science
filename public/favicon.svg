<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#primaryGrad)" />
  
  <!-- Central Nucleus -->
  <circle cx="16" cy="16" r="2.8" fill="#ffffff" />
  
  <!-- Diagonal Orbit 1 -->
  <ellipse cx="16" cy="16" rx="10.5" ry="4.2" transform="rotate(30 16 16)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.95" />
  
  <!-- Diagonal Orbit 2 -->
  <ellipse cx="16" cy="16" rx="10.5" ry="4.2" transform="rotate(-30 16 16)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.95" />
  
  <!-- Vertical/Horizontal Orbit -->
  <ellipse cx="16" cy="16" rx="10.5" ry="4.2" transform="rotate(90 16 16)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.95" />
  
  <!-- Orbital Electron Dots for crisp detail -->
  <circle cx="25" cy="11" r="1.2" fill="#ffffff" />
  <circle cx="7" cy="21" r="1.2" fill="#ffffff" />
</svg>
